<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivos da turma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F1;
    --surface: #FFFFFF;
    --ink: #10231C;
    --muted: #556961;
    --line: #CBD8D3;
    --accent: #0A6B4B;
    --accent-ink: #FFFFFF;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1A16;
      --surface: #16251F;
      --ink: #E6F0EC;
      --muted: #9DB3AA;
      --line: #28403A;
      --accent: #5FD3A5;
      --accent-ink: #08241A;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body { margin: 0; line-height: 1.5; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: clamp(2rem, 7vw, 3.25rem); font-weight: 800; line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  section { margin-bottom: 36px; }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .data { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .nome { font-weight: 600; overflow-wrap: anywhere; }
  .desc { color: var(--muted); font-size: .9rem; }
  a.baixar { flex: none; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 8px; }
  a.baixar:hover { filter: brightness(1.1); }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .vazio { color: var(--muted); }
  @media (max-width: 460px) { li { flex-direction: column; align-items: stretch; } a.baixar { text-align: center; } }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Arquivos da turma</h1>
  <p class="sub" id="subtitulo">Baixe aqui os materiais de cada aula.</p>
  <div id="lista"><p class="vazio">Nenhum arquivo publicado ainda.</p></div>
</main>

<script>
/* ============ EDITE APENAS ESTA PARTE ============
   Cada aula tem um título, uma data e uma lista de arquivos.
   "arquivo" é o caminho dentro da pasta "arquivos/" do repositório.
   Coloque a aula mais recente no topo. */
const TITULO = "Arquivos da turma";
const SUBTITULO = "Baixe aqui os materiais de cada aula.";

const AULAS = [
  {
    titulo: "Aula 2",
    data: "25/10/2026",
    arquivos: [
      { nome: "Código de exemplo", arquivo: "aula2/exemplo.zip", descricao: "Projeto inicial da aula" },
      { nome: "Slides", arquivo: "aula2/slides.pdf" }
    ]
  },
  {
    titulo: "Aula 1",
    data: "18/10/2026",
    arquivos: [
      { nome: "Roteiro da aula", arquivo: "aula1/roteiro.pdf" }
    ]
  }
];
/* ============ FIM DA PARTE EDITÁVEL ============ */

document.getElementById("titulo").textContent = TITULO;
document.getElementById("subtitulo").textContent = SUBTITULO;
document.title = TITULO;

const lista = document.getElementById("lista");
if (AULAS.length) {
  lista.textContent = "";
  AULAS.forEach(function (aula) {
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = aula.titulo;
    sec.appendChild(h2);
    if (aula.data) {
      const d = document.createElement("p");
      d.className = "data";
      d.textContent = aula.data;
      sec.appendChild(d);
    }
    const ul = document.createElement("ul");
    aula.arquivos.forEach(function (f) {
      const li = document.createElement("li");
      const info = document.createElement("div");
      const n = document.createElement("div");
      n.className = "nome";
      n.textContent = f.nome;
      info.appendChild(n);
      if (f.descricao) {
        const ds = document.createElement("div");
        ds.className = "desc";
        ds.textContent = f.descricao;
        info.appendChild(ds);
      }
      const a = document.createElement("a");
      a.className = "baixar";
      a.href = "arquivos/" + f.arquivo;
      a.setAttribute("download", "");
      a.textContent = "Baixar";
      a.setAttribute("aria-label", "Baixar " + f.nome);
      li.appendChild(info);
      li.appendChild(a);
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    lista.appendChild(sec);
  });
}
</script>
</body>
</html>
